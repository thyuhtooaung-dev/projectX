<header class="h-14 px-5 bg-[#18181b] border-b border-[#27272a] flex items-center justify-between shrink-0 z-10 select-none">
  <div class="flex items-center gap-3 min-w-0">
    <div class="flex items-center gap-2 text-xs text-zinc-400 font-mono">
      <lucide-icon [img]="Terminal" class="w-4 h-4 text-zinc-500"></lucide-icon>
      <span class="text-zinc-500">session</span>
      <span class="text-zinc-600">/</span>
      <span class="text-zinc-200 font-medium truncate max-w-56">
        {{ conversationTitle() || (conversationId() ? 'thread_' + conversationId() : 'untitled') }}
      </span>
    </div>

    <app-model-select

      [models]="availableModels()"
      [selectedModelId]="selectedModelId()"
      (modelSelected)="modelSelected.emit($event)"
    ></app-model-select>

    @if (modelUsed()) {
      <div class="hidden md:flex items-center gap-1.5 px-2 py-1 rounded-md bg-zinc-900 border border-zinc-800 text-[11px] font-mono text-zinc-400">
        <lucide-icon [img]="Cpu" class="w-3 h-3 text-zinc-500"></lucide-icon>
        <span class="truncate max-w-48">{{ modelUsed() }}</span>
      </div>
    }
  </div>

  <div class="flex items-center gap-2.5">
    @if (conversationId()) {
      <app-badge variant="default">#{{ conversationId() }}</app-badge>
    }
    <button
      app-button
      variant="secondary"
      size="sm"
      (click)="newChat.emit()"
    >
      <lucide-icon [img]="Plus" class="w-3.5 h-3.5"></lucide-icon>
      <span>New Thread</span>
    </button>
  </div>
</header>
