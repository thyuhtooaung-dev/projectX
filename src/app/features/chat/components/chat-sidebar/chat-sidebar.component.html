<aside class="w-64 md:w-72 lg:w-80 bg-[#18181b] border-r border-[#27272a] flex flex-col h-full shrink-0 select-none">
  <div class="h-14 px-4 border-b border-[#27272a] flex items-center justify-between">
    <div class="flex items-center gap-2.5">
      <div class="w-7 h-7 rounded-lg bg-zinc-900 border border-zinc-800 flex items-center justify-center text-zinc-300">
        <lucide-icon [img]="Bot" class="w-4 h-4"></lucide-icon>
      </div>
      <span class="text-sm font-semibold text-zinc-100 tracking-tight">Zed Assistant</span>
    </div>
    <button
      type="button"
      (click)="newChat.emit()"
      title="New Thread"
      class="p-1.5 rounded-md text-zinc-400 hover:text-zinc-100 hover:bg-zinc-800 transition-colors cursor-pointer"
    >
      <lucide-icon [img]="Plus" class="w-4 h-4"></lucide-icon>
    </button>
  </div>

  <div class="p-3 border-b border-[#27272a]">
    <button
      app-button
      variant="secondary"
      (click)="newChat.emit()"
      class="w-full justify-start text-zinc-200"
    >
      <lucide-icon [img]="Plus" class="w-4 h-4"></lucide-icon>
      <span>New Thread</span>
    </button>
  </div>

  <div class="flex-1 overflow-y-auto p-2 space-y-1">
    <div class="px-2.5 py-1.5 text-xs font-semibold uppercase tracking-wider text-zinc-500 font-mono">
      Threads
    </div>

    @for (conv of conversations(); track conv.id) {
      <div
        (click)="selectConversation.emit(conv.id)"
        class="group w-full flex items-center justify-between gap-2 px-3 py-2 rounded-lg text-sm transition-all cursor-pointer relative"
        [class.bg-zinc-800]="activeConversationId() === conv.id"
        [class.text-zinc-100]="activeConversationId() === conv.id"
        [class.font-medium]="activeConversationId() === conv.id"
        [class.border]="activeConversationId() === conv.id"
        [class.border-zinc-700]="activeConversationId() === conv.id"
        [class.text-zinc-400]="activeConversationId() !== conv.id"
        [class.hover:text-zinc-200]="activeConversationId() !== conv.id"
        [class.hover:bg-zinc-800/50]="activeConversationId() !== conv.id"
      >
        @if (activeConversationId() === conv.id) {
          <div class="absolute left-0 top-1.5 bottom-1.5 w-1 bg-blue-500 rounded-r"></div>
        }
        <div class="flex items-center gap-2.5 min-w-0 flex-1">
          <lucide-icon
            [img]="MessageSquare"
            class="w-4 h-4 shrink-0 text-zinc-500 group-hover:text-zinc-300 transition-colors"
          ></lucide-icon>
          <span class="truncate text-xs">{{ conv.title || 'thread_' + conv.id }}</span>
        </div>

        <button
          type="button"
          (click)="onDelete($event, conv.id)"
          title="Delete thread"
          class="opacity-0 group-hover:opacity-100 p-1 hover:text-red-400 hover:bg-red-950/40 rounded transition-all text-zinc-500"
        >
          <lucide-icon [img]="Trash2" class="w-3.5 h-3.5"></lucide-icon>
        </button>
      </div>
    } @empty {
      <div class="px-3 py-8 text-center text-xs text-zinc-500">
        No previous threads yet.
      </div>
    }
  </div>
</aside>
