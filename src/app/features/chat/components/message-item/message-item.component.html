@if (message().role === 'user') {
  <div class="flex flex-col items-end self-end w-full space-y-1.5">
    <div class="flex items-center gap-1.5 text-xs font-mono text-zinc-400 pr-1 select-none">
      <lucide-icon [img]="User" class="w-3.5 h-3.5 text-zinc-400"></lucide-icon>
      <span>you</span>
    </div>
    <div class="ml-auto bg-zinc-800 border border-zinc-700/80 text-zinc-100 px-4 py-3 rounded-xl text-sm leading-relaxed whitespace-pre-wrap wrap-break-word shadow-xs select-text">
      {{ message().content }}
    </div>
  </div>
} @else {
  <div class="flex flex-col items-start self-start w-full space-y-1.5">
    <div class="flex items-center gap-1.5 text-xs font-mono text-zinc-300 pl-0.5 font-medium select-none">
      <lucide-icon [img]="Bot" class="w-4 h-4 text-zinc-300"></lucide-icon>
      <span>assistant</span>
    </div>

    <div class="w-full bg-[#18181b] border border-[#27272a] rounded-xl p-4 text-sm text-zinc-200 leading-relaxed wrap-break-word shadow-xs select-text">
      @if (message().reasoning) {
        <details class="group mb-3 bg-[#121214] border border-[#27272a] rounded-lg overflow-hidden text-xs" [open]="!message().content">
          <summary class="flex items-center justify-between px-3 py-2 cursor-pointer select-none font-mono text-xs text-zinc-400 hover:text-zinc-200 hover:bg-zinc-900 transition-colors list-none">
            <div class="flex items-center gap-2">
              <lucide-icon [img]="Brain" class="w-3.5 h-3.5 text-zinc-400"></lucide-icon>
              <span>thought_process</span>
            </div>
            <div class="flex items-center gap-2">
              <app-badge [variant]="!message().content ? 'active' : 'secondary'">
                {{ !message().content ? 'thinking...' : 'thought' }}
              </app-badge>
              <lucide-icon [img]="ChevronDown" class="w-3.5 h-3.5 text-zinc-400 group-open:rotate-180 transition-transform"></lucide-icon>
            </div>
          </summary>
          <div class="p-3 border-t border-[#27272a] text-zinc-400 font-mono text-xs leading-relaxed bg-[#101012] max-h-64 overflow-y-auto">
            <markdown [data]="message().reasoning"></markdown>
          </div>
        </details>
      }

      @if (message().content) {
        <markdown [data]="message().content"></markdown>
      }
    </div>
  </div>
}
