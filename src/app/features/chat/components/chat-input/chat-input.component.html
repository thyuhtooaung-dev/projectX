<footer class="p-3.5 md:p-4 bg-[#18181b] border-t border-[#27272a] shrink-0">
  <form (ngSubmit)="onSubmit()" class="max-w-4xl mx-auto w-full">
    <div
      class="flex items-center gap-2.5 bg-[#121214] border border-[#27272a] focus-within:border-zinc-500 focus-within:ring-1 focus-within:ring-zinc-600 rounded-xl p-2 pl-3.5 transition-all shadow-inner"
    >
      <lucide-icon [img]="Terminal" class="w-4 h-4 text-zinc-500 shrink-0"></lucide-icon>
      <input
        type="text"
        [ngModel]="prompt()"
        (ngModelChange)="prompt.set($event)"
        (keydown)="onKeyDown($event)"
        name="prompt"
        placeholder="Type a message to the assistant..."
        [disabled]="loading()"
        class="flex-1 bg-transparent text-zinc-100 placeholder-zinc-500 text-sm outline-none font-sans disabled:opacity-50"
        autocomplete="off"
      />
      <button
        app-button
        variant="default"
        size="sm"
        type="submit"
        [disabled]="loading() || !prompt().trim()"
      >
        <span>Send</span>
        <lucide-icon [img]="SendHorizontal" class="w-3.5 h-3.5"></lucide-icon>
      </button>
    </div>
  </form>
</footer>
